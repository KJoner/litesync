# Obsidian 插件发布：推送与 manifest.json 版本一致的 tag（无 v 前缀，如 0.6.0）
# 即自动构建并创建 draft Release，附上市场安装所需的三个产物。
#   git tag 0.6.0 && git push origin 0.6.0
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Lint (eslint-plugin-obsidianmd)
        run: |
          npm ci
          npm run lint

      - name: Build plugin
        run: npm run test:mobile

      - name: Verify tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "${GITHUB_REF#refs/tags/}" ]; then
            echo "manifest.json version ($MANIFEST_VERSION) != tag (${GITHUB_REF#refs/tags/})"
            exit 1
          fi

      # 产物溯源证明（默认生成 SLSA build provenance）：
      # 用户可加密学验证 Release 资产确实构建自本仓库源码
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 带连字符的 semver（0.17.0-rc.1 这类）自动标记为 pre-release。
          # BRAT 靠这个标记区分 beta 与正式版：忘了勾，beta 测试包会被当成
          # 正式版推给所有人——而 RC 的前提恰恰是「别装到真实 Vault 上」
          prerelease: ${{ contains(github.ref_name, '-') }}
          # 发布说明取自仓库里的 docs/releases/<tag>.md（没有就留空，由人工填）
          body_path: docs/releases/${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            main.js
            manifest.json
            styles.css
